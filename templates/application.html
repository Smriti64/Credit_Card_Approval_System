<!-- templates/application.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply - Credit Card Approval System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <a href="/" class="back-link">← Back to Home</a>
            <h1>Credit Card Application</h1>
            <p>Fill in your details to check eligibility</p>
        </header>

        <form action="/predict" method="POST" class="application-form">
            
            <!-- Personal Information -->
            <div class="form-section">
                <h2>Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select name="gender" id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="M">Male</option>
                            <option value="F">Female</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="age">Age (Years) *</label>
                        <input type="number" name="age" id="age" min="18" max="100" required placeholder="e.g., 35">
                    </div>
                    
                    <div class="form-group">
                        <label for="family_status">Marital Status *</label>
                        <select name="family_status" id="family_status" required>
                            <option value="">Select Status</option>
                            <option value="Single / not married">Single</option>
                            <option value="Married">Married</option>
                            <option value="Civil marriage">Civil Marriage</option>
                            <option value="Separated">Separated</option>
                            <option value="Widow">Widow</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="education">Education Level *</label>
                        <select name="education" id="education" required>
                            <option value="">Select Education</option>
                            <option value="Lower secondary">Lower Secondary</option>
                            <option value="Secondary / secondary special">Secondary</option>
                            <option value="Incomplete higher">Incomplete Higher</option>
                            <option value="Higher education">Higher Education</option>
                            <option value="Academic degree">Academic Degree</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="children">Number of Children *</label>
                        <input type="number" name="children" id="children" min="0" max="20" required placeholder="e.g., 2">
                    </div>
                    
                    <div class="form-group">
                        <label for="family_members">Total Family Members *</label>
                        <input type="number" name="family_members" id="family_members" min="1" max="20" required placeholder="e.g., 4">
                    </div>
                </div>
            </div>

            <!-- Financial Information -->
            <div class="form-section">
                <h2>Financial Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="income">Annual Income ($) *</label>
                        <input type="number" name="income" id="income" min="0" step="1000" required placeholder="e.g., 75000">
                    </div>
                    
                    <div class="form-group">
                        <label for="income_type">Income Type *</label>
                        <select name="income_type" id="income_type" required>
                            <option value="">Select Income Type</option>
                            <option value="Working">Working</option>
                            <option value="Commercial associate">Commercial Associate</option>
                            <option value="Pensioner">Pensioner</option>
                            <option value="State servant">State Servant</option>
                            <option value="Student">Student</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="employed_years">Years Employed *</label>
                        <input type="number" name="employed_years" id="employed_years" min="0" max="50" required placeholder="e.g., 5">
                    </div>
                    
                    <div class="form-group">
                        <label for="occupation">Occupation Type *</label>
                        <select name="occupation" id="occupation" required>
                            <option value="">Select Occupation</option>
                            <option value="Accountants">Accountants</option>
                            <option value="Cleaning staff">Cleaning Staff</option>
                            <option value="Cooking staff">Cooking Staff</option>
                            <option value="Core staff">Core Staff</option>
                            <option value="Drivers">Drivers</option>
                            <option value="HR staff">HR Staff</option>
                            <option value="High skill tech staff">High Skill Tech Staff</option>
                            <option value="IT staff">IT Staff</option>
                            <option value="Laborers">Laborers</option>
                            <option value="Low-skill Laborers">Low-Skill Laborers</option>
                            <option value="Managers">Managers</option>
                            <option value="Medicine staff">Medicine Staff</option>
                            <option value="Private service staff">Private Service Staff</option>
                            <option value="Realty agents">Realty Agents</option>
                            <option value="Sales staff">Sales Staff</option>
                            <option value="Secretaries">Secretaries</option>
                            <option value="Security staff">Security Staff</option>
                            <option value="Waiters/barmen staff">Waiters/Barmen</option>
                            <option value="Unknown">Other/Unknown</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Property & Assets -->
            <div class="form-section">
                <h2>Property & Assets</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="own_car">Own a Car? *</label>
                        <select name="own_car" id="own_car" required>
                            <option value="">Select Option</option>
                            <option value="Y">Yes</option>
                            <option value="N">No</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="own_realty">Own Property/Realty? *</label>
                        <select name="own_realty" id="own_realty" required>
                            <option value="">Select Option</option>
                            <option value="Y">Yes</option>
                            <option value="N">No</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="housing_type">Housing Type *</label>
                        <select name="housing_type" id="housing_type" required>
                            <option value="">Select Housing Type</option>
                            <option value="House / apartment">House/Apartment (Owned)</option>
                            <option value="With parents">With Parents</option>
                            <option value="Municipal apartment">Municipal Apartment</option>
                            <option value="Rented apartment">Rented Apartment</option>
                            <option value="Office apartment">Office Apartment</option>
                            <option value="Co-op apartment">Co-op Apartment</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="form-section">
                <h2>Contact Information</h2>
                <div class="checkbox-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" name="work_phone" value="1">
                        <span>I have a work phone</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="phone" value="1">
                        <span>I have a personal phone</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="email" value="1">
                        <span>I have an email address</span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="submit-button">Check Eligibility</button>
                <button type="reset" class="reset-button">Clear Form</button>
            </div>
        </form>

        <footer>
            <p class="disclaimer">Your information is processed securely and not stored.</p>
        </footer>
    </div>
</body>
</html>
